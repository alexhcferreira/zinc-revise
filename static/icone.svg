<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- zinco: claro no canto superior esquerdo, escuro no canto inferior direito -->
    <linearGradient id="zinco" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3e7eb"/>
      <stop offset="0.45" stop-color="#a7b0ba"/>
      <stop offset="1" stop-color="#4a535d"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#zinco)"/>
</svg>
