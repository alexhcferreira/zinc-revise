<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ZincRevise</title>
  <meta name="theme-color" content="#2f6bed">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <script>
    // aplica o tema antes de pintar, para nÃ£o piscar
    (function () {
      var t = null;
      try { t = localStorage.getItem("zinc-tema"); } catch (e) {}
      if (t === "papel") t = "suave";
      if (!t) t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "escuro" : "claro";
      document.documentElement.setAttribute("data-tema", t);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
